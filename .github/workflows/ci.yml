name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge-typecheck:
    name: Bridge API — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bridge-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  widget-typecheck:
    name: Support Widget — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: support-widget/package-lock.json
      - run: npm ci
      - run: npm run typecheck
